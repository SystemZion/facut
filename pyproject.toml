[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "facut"
version = "0.7.2"
description = "Fast AI Cut — a deterministic, agent-friendly command-line video editor"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "facut contributors" }]
keywords = ["video", "editing", "ffmpeg", "cli", "ai-agent"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Environment :: Console",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
]
dependencies = [
  # Click 8.4 currently clips Rich option names in Windows 80-column terminals.
  "click>=8.1,<8.4",
  "platformdirs>=4.2,<5",
  "pydantic>=2.7,<3",
  "rich>=13.7,<15",
  # Typer 0.22+ currently truncates Rich option names in 80-column CI terminals.
  "typer>=0.12,<0.22",
  "openpyxl>=3.1,<4",
  "opentimelineio>=0.18,<0.19",
  "Pillow>=11,<13",
]

[project.optional-dependencies]
yaml = ["PyYAML>=6.0,<7"]
dev = [
  "pytest>=8.2,<9",
  "pytest-cov>=5,<7",
  "pytest-timeout>=2.3,<3",
]
build = [
  "pyinstaller>=6.10,<7",
]
analysis = [
  "faster-whisper>=1.1,<2",
]

[project.scripts]
facut = "facut.cli.main:main"

[tool.hatch.build.targets.wheel]
packages = ["src/facut"]

[tool.pytest.ini_options]
addopts = "-ra"
testpaths = ["tests"]
pythonpath = ["src"]

[tool.coverage.run]
branch = true
source = ["facut"]

[tool.coverage.report]
show_missing = true
skip_covered = true
