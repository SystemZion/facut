name: tests

on:
  push:
    branches: ["main", "facut/ffmpeg-9.1"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  pytest:
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        python-version: ["3.11", "3.13"]
    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install modern FFmpeg (Ubuntu)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y ffmpeg

      - name: Install modern FFmpeg (Windows)
        if: runner.os == 'Windows'
        run: choco install ffmpeg -y --no-progress

      - name: Install modern FFmpeg (macOS)
        if: runner.os == 'macOS'
        run: brew install ffmpeg

      - name: Verify FFmpeg baseline
        run: ffmpeg -hide_banner -version

      - name: Install package
        run: python -m pip install --upgrade pip && python -m pip install -e ".[dev]"

      - name: Run tests
        run: python -m pytest -vv --timeout=60 --timeout-method=thread

      - name: Compile package
        run: python -m compileall -q src

      - name: Release privacy scan
        run: python tools/privacy_scan.py

  ffmpeg-windows-sdk:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Install Windows cross compiler
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc-mingw-w64-x86-64-posix mingw-w64-tools nasm llvm
          sudo update-alternatives --set x86_64-w64-mingw32-gcc /usr/bin/x86_64-w64-mingw32-gcc-posix
      - name: Build signed-source FFmpeg 9.1 LGPL shared SDK
        run: bash tools/build_ffmpeg_windows_sdk.sh "$RUNNER_TEMP/ffmpeg91-sdk"
      - uses: actions/upload-artifact@v4
        with:
          name: ffmpeg91-windows-sdk
          path: ${{ runner.temp }}/ffmpeg91-sdk
          if-no-files-found: error
          retention-days: 5

  native-windows-x64:
    needs: ffmpeg-windows-sdk
    runs-on: windows-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
      - uses: actions/download-artifact@v4
        with:
          name: ffmpeg91-windows-sdk
          path: ffmpeg91-sdk
      - name: Build, smoke-test and package Windows x64 release
        shell: pwsh
        run: ./tools/test_and_package_ffmpeg91.ps1
      - uses: actions/upload-artifact@v4
        with:
          name: facut-windows-x64-release
          path: |
            dist/facut-windows-x64.zip
            dist/facut-release.json
            ffmpeg91-sdk/ffmpeg-9.1.tar.xz
          if-no-files-found: error
          retention-days: 7
